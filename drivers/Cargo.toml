[package]
name = "drivers"
version = "0.15.0"
edition = "2024"

[features]
default = []
async = ["dep:embedded-hal-async"]
defmt = [
    "dep:defmt",
    "embedded-hal/defmt-03",
    "embedded-hal-async?/defmt-03",
]

[dependencies]
embedded-hal = { version = "1.0.0" }
embedded-hal-async = { version = "1.0.0", optional = true }
defmt = { version = "1.0.1", optional = true }
